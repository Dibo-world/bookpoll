name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookpoll-auth-service:latest

  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push book-service
        uses: docker/build-push-action@v5
        with:
          context: ./book-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookpoll-book-service:latest

  build-vote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vote-service
        uses: docker/build-push-action@v5
        with:
          context: ./vote-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookpoll-vote-service:latest