<script>
  const NOTIFY_API = "http://localhost:8004/api/v1/notifications";
  const userId = localStorage.getItem("userId");

  window.onload = () => {
    if (!userId) {
      alert("로그인이 필요합니다!");
      window.location.href = "auth.html";
      return;
    }
    loadNotifications();
  };

  async function loadNotifications() {
    try {
      const res = await fetch(NOTIFY_API, {
        headers: {
          "Content-Type": "application/json",
          "X-User-Id": userId
        }
      });

      const result = await res.json();

      if (!res.ok || result.success === false) {
        throw new Error(result.message || "알림 조회 실패");
      }

      renderNotifications(result.data || []);
    } catch (e) {
      document.getElementById("notification-list").innerHTML =
        '<p class="text-red-500">알림을 불러오지 못했습니다.</p>';
    }
  }

  function renderNotifications(notis) {
    const list = document.getElementById("notification-list");

    if (notis.length === 0) {
      list.innerHTML = '<p class="text-textsec">알림이 없습니다.</p>';
      return;
    }

    list.innerHTML = notis.map(noti => `
      <div class="bg-surface border border-gray-200 rounded-xl p-4 shadow-sm flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-primary mb-1 block">${noti.type || "NOTICE"}</span>
          <h4 class="font-semibold text-sm">${noti.title || ""}</h4>
          <p class="text-textmain font-medium">${noti.message}</p>
        </div>
        <span class="text-xs text-textsec">${noti.createdAt || ""}</span>
      </div>
    `).join("");
  }
</script>
