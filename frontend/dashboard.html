<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookPoll - 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0FBA81',
                        primaryHover: '#0DA06F',
                        background: '#FAFAFA',
                        surface: '#FFFFFF',
                        textmain: '#0F172A',
                        textsec: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        .hidden-section { display: none; }
        .tab-active { border-bottom-color: #0FBA81; color: #0FBA81; font-weight: 600; }
    </style>
</head>
<body class="bg-background text-textmain flex h-screen overflow-hidden">

    <aside class="w-64 bg-surface border-r border-gray-200 flex flex-col justify-between z-20">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-textmain mb-8 flex items-center gap-2">📚 BookPoll</h1>
            <nav class="space-y-2">
                <button onclick="switchMenu('book')" id="menu-book" class="w-full text-left px-4 py-2 rounded-lg bg-primary/10 text-primary font-semibold transition-colors">
                    📖 도서 관리
                </button>
                <button onclick="switchMenu('vote')" id="menu-vote" class="w-full text-left px-4 py-2 rounded-lg text-textsec hover:bg-gray-100 transition-colors">
                    📊 투표 관리
                </button>
                <button onclick="switchMenu('mypage')" id="menu-mypage" class="w-full text-left px-4 py-2 rounded-lg text-textsec hover:bg-gray-100 transition-colors">
                    👤 마이페이지
                </button>
            </nav>
        </div>
        <div class="p-6 border-t border-gray-200">
            <p id="user-info" class="text-sm font-medium mb-3 text-textsec">로그인 필요</p>
            <button onclick="logout()" class="w-full text-left px-4 py-2 rounded-lg text-red-500 hover:bg-red-50 transition-colors text-sm font-semibold">
                로그아웃
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-end px-8 gap-4 z-30">
            <div class="relative">
                <button onclick="toggleNotificationDropdown()" class="p-2 rounded-full hover:bg-gray-100 transition-colors relative focus:outline-none">
                    <span class="text-xl">🔔</span>
                    <span id="noti-badge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </button>

                <div id="noti-dropdown" class="absolute right-0 mt-2 w-80 bg-surface border border-gray-200 rounded-xl shadow-xl hidden overflow-hidden max-h-96 flex flex-col">
                    <div class="p-3 border-b border-gray-100 font-semibold text-sm flex justify-between items-center bg-gray-50">
                        <span>최근 알림</span>
                        <button onclick="clearNotifications()" class="text-xs text-textsec hover:text-red-500">모두 지우기</button>
                    </div>
                    <div id="noti-dropdown-list" class="overflow-y-auto divide-y divide-gray-100 text-xs text-textsec">
                        <div class="p-4 text-center">새로운 알림이 없습니다.</div>
                    </div>
                </div>
            </div>

            <button onclick="switchMenu('mypage')" class="w-8 h-8 rounded-full bg-primary text-white font-bold flex items-center justify-center text-sm shadow-sm hover:opacity-90 transition-opacity">
                <span id="user-avatar">U</span>
            </button>
        </header>

        <div id="toast" class="fixed bottom-8 right-8 px-5 py-3 rounded-xl shadow-2xl text-sm font-medium hidden z-50 transition-all border transform translate-y-0"></div>

        <main class="flex-1 overflow-y-auto p-8">
            <section id="section-book">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">도서 목록</h2>
                    <button onclick="openModal('book-modal')" class="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                        + 책 등록하기
                    </button>
                </div>
                <div id="book-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section id="section-vote" class="hidden-section">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">진행 중인 투표</h2>
                    <button onclick="openModal('vote-modal')" class="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                        + 투표 생성하기
                    </button>
                </div>
                <div id="vote-list" class="space-y-4"></div>
            </section>

            <section id="section-mypage" class="hidden-section">
                <h2 class="text-2xl font-bold mb-4">👤 마이페이지</h2>

                <div class="border-b border-gray-200 mb-6 flex gap-6 text-sm">
                    <button onclick="switchMypageTab('my-books')" id="tab-my-books" class="py-2 border-b-2 border-transparent text-textsec tab-active">
                        📚 내가 등록한 도서
                    </button>
                    <button onclick="switchMypageTab('my-votes')" id="tab-my-votes" class="py-2 border-b-2 border-transparent text-textsec">
                        📊 나의 투표 기록
                    </button>
                </div>

                <div id="content-my-books" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="content-my-votes" class="space-y-4 hidden-section"></div>
            </section>
        </main>
    </div>

    <div id="book-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-surface p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h3 class="text-lg font-bold mb-4">새 책 등록</h3>
            <form onsubmit="handleRegisterBook(event)">
                <input type="text" id="book-title" required placeholder="책 제목" class="w-full mb-3 px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none">
                <input type="text" id="book-author" required placeholder="저자" class="w-full mb-3 px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none">
                <textarea id="book-desc" rows="3" placeholder="간단한 설명" class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none"></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('book-modal')" class="px-4 py-2 text-textsec hover:bg-gray-100 rounded-lg">취소</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primaryHover">등록</button>
                </div>
            </form>
        </div>
    </div>

    <div id="edit-book-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-surface p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h3 class="text-lg font-bold mb-4">📝 도서 정보 수정</h3>
            <form onsubmit="handleUpdateBook(event)">
                <input type="hidden" id="edit-book-id">
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-textsec mb-1">책 제목</label>
                    <input type="text" id="edit-book-title" required class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none">
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-textsec mb-1">저자</label>
                    <input type="text" id="edit-book-author" required class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-textsec mb-1">설명</label>
                    <textarea id="edit-book-desc" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('edit-book-modal')" class="px-4 py-2 text-textsec hover:bg-gray-100 rounded-lg">취소</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primaryHover">수정 완료</button>
                </div>
            </form>
        </div>
    </div>

    <div id="vote-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-surface p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h3 class="text-lg font-bold mb-4">새 투표 생성</h3>
            <form onsubmit="handleCreateVote(event)">
                <input type="text" id="vote-title" required placeholder="투표 제목 (예: 2026 최고의 책)" class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-1 focus:ring-primary outline-none">
                <p class="text-sm text-textmain font-medium mb-2">후보 도서 선택 (다중 선택)</p>
                <div id="vote-book-checkboxes" class="max-h-40 overflow-y-auto border rounded-lg p-3 mb-4 space-y-2 text-sm"></div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('vote-modal')" class="px-4 py-2 text-textsec hover:bg-gray-100 rounded-lg">취소</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primaryHover">생성</button>
                </div>
            </form>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-surface p-6 rounded-2xl w-full max-w-lg shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="result-modal-title" class="text-xl font-bold text-textmain">📊 투표 결과 통계</h3>
                <button onclick="closeModal('result-modal')" class="text-textsec hover:text-textmain text-xl">✕</button>
            </div>

            <div id="result-chart-container" class="space-y-4 my-6"></div>

            <div class="flex justify-end">
                <button type="button" onclick="closeModal('result-modal')" class="px-4 py-2 bg-textmain text-white rounded-lg hover:bg-gray-800 text-sm font-semibold">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const AUTH_API = "http://localhost:8001/api/v1/auth";
        const BOOK_API = "http://localhost:8002/api/v1/books";
        const VOTE_API = "http://localhost:8003/api/v1/polls";
        const NOTIFY_API = "http://localhost:8004/api/v1/notifications";

        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');

        let booksData = [];
        let localNotifications = [];
        let checkedLastTimestamp = null;
        let notificationPoller = null;

        window.onload = () => {
            if (!userId) {
                alert('로그인이 필요합니다!');
                window.location.href = 'auth.html';
                return;
            }

            document.getElementById('user-info').innerText = `👤 ${username || '사용자'}님 환영합니다`;
            document.getElementById('user-avatar').innerText = username ? username.charAt(0).toUpperCase() : 'U';

            loadBooks();
            initNotificationPolling();
        };

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            if (isSuccess) {
                toast.className = "fixed bottom-8 right-8 px-5 py-3 rounded-xl shadow-2xl text-sm font-medium z-50 border bg-green-50 border-green-200 text-green-700 block";
            } else {
                toast.className = "fixed bottom-8 right-8 px-5 py-3 rounded-xl shadow-2xl text-sm font-medium z-50 border bg-red-50 border-red-200 text-red-700 block";
            }
            setTimeout(() => {
                toast.className = "hidden";
            }, 4000);
        }

        function getHeaders(extraHeaders = {}) {
            return {
                'Content-Type': 'application/json',
                'X-User-Id': String(userId),
                ...extraHeaders
            };
        }

        async function apiFetch(url, options = {}) {
            const config = {
                method: options.method || 'GET',
                headers: getHeaders(options.headers || {}),
                ...options
            };

            const res = await fetch(url, config);

            let result = {};
            try {
                result = await res.json();
            } catch (e) {
                result = {};
            }

            if (!res.ok || result.success === false) {
                const errorMessage = result.message || `HTTP ${res.status} 오류`;
                const error = new Error(errorMessage);
                error.status = res.status;
                error.result = result;
                throw error;
            }

            return result;
        }

        function getBookOwnerId(book) {
            return book.userId ?? book.user_id ?? book.userid ?? null;
        }

        function getNotificationType(notification) {
            return notification.type || notification.eventType || 'NOTICE';
        }

        function getNotificationTimestamp(notification) {
            return notification.createdAt || notification.timestamp || notification.created_at || null;
        }

        function switchMenu(menu) {
            document.getElementById('section-book').classList.add('hidden-section');
            document.getElementById('section-vote').classList.add('hidden-section');
            document.getElementById('section-mypage').classList.add('hidden-section');
            document.getElementById(`section-${menu}`).classList.remove('hidden-section');

            const activeStyle = "w-full text-left px-4 py-2 rounded-lg bg-primary/10 text-primary font-semibold transition-colors".split(' ');
            const inactiveStyle = "w-full text-left px-4 py-2 rounded-lg text-textsec hover:bg-gray-100 transition-colors".split(' ');

            ['book', 'vote', 'mypage'].forEach(m => {
                document.getElementById(`menu-${m}`).className = (m === menu ? activeStyle : inactiveStyle).join(' ');
            });

            if (menu === 'book') loadBooks();
            else if (menu === 'vote') loadPolls();
            else if (menu === 'mypage') {
                loadBooks().then(() => switchMypageTab('my-books'));
            }
        }

        function switchMypageTab(tab) {
            document.getElementById('content-my-books').classList.add('hidden-section');
            document.getElementById('content-my-votes').classList.add('hidden-section');
            document.getElementById('tab-my-books').classList.remove('tab-active');
            document.getElementById('tab-my-votes').classList.remove('tab-active');

            document.getElementById(`content-${tab}`).classList.remove('hidden-section');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');

            if (tab === 'my-books') renderMyBooks();
            if (tab === 'my-votes') loadMyVotes();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        async function loadBooks() {
            try {
                const result = await apiFetch(BOOK_API);
                booksData = result.data || [];
                renderBooks(booksData);
                renderBookCheckboxes(booksData);
            } catch (e) {
                showToast("도서 서버 연결 실패", false);
            }
        }

        function renderBooks(books) {
            document.getElementById('book-grid').innerHTML = books.map(book => `
                <div class="bg-surface border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-all relative">
                    <h3 class="text-lg font-bold text-textmain mb-1">${book.title}</h3>
                    <p class="text-sm text-primary font-medium mb-3">${book.author}</p>
                    <p class="text-sm text-textsec line-clamp-2">${book.description || '설명이 없습니다.'}</p>
                    ${String(getBookOwnerId(book)) === String(userId) ? `<span class="absolute top-4 right-4 bg-gray-100 text-gray-600 text-[10px] px-1.5 py-0.5 rounded font-bold">내 책</span>` : ''}
                </div>
            `).join('');
        }

        async function handleRegisterBook(e) {
            e.preventDefault();

            const payload = {
                title: document.getElementById('book-title').value,
                author: document.getElementById('book-author').value,
                description: document.getElementById('book-desc').value
            };

            try {
                await apiFetch(BOOK_API, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                showToast('책이 등록되었습니다!');
                closeModal('book-modal');
                e.target.reset();
                loadBooks();
            } catch (e) {
                showToast(e.message || '등록 실패', false);
            }
        }

        function renderMyBooks() {
            const myBooks = booksData.filter(b => String(getBookOwnerId(b)) === String(userId));
            const container = document.getElementById('content-my-books');

            if (myBooks.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-textsec text-sm">내가 등록한 도서가 존재하지 않습니다.</div>`;
                return;
            }

            container.innerHTML = myBooks.map(book => `
                <div class="bg-surface border-2 border-primary/20 rounded-xl p-5 shadow-sm flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-bold text-textmain mb-1">${book.title}</h3>
                        <p class="text-sm text-primary font-medium mb-2">${book.author}</p>
                        <p class="text-xs text-textsec line-clamp-3 mb-4">${book.description || '설명이 없습니다.'}</p>
                    </div>
                    <div class="flex justify-end gap-2 border-t pt-3 border-gray-100">
                        <button onclick="openEditBookModal(${book.id}, '${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}', '${(book.description || '').replace(/\n/g, ' ').replace(/'/g, "\\'")}')" class="px-2.5 py-1 text-xs border border-gray-300 rounded hover:bg-gray-50 font-medium">수정</button>
                        <button onclick="deleteBook(${book.id})" class="px-2.5 py-1 text-xs bg-red-50 text-red-600 rounded hover:bg-red-100 font-medium">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function openEditBookModal(id, title, author, desc) {
            document.getElementById('edit-book-id').value = id;
            document.getElementById('edit-book-title').value = title;
            document.getElementById('edit-book-author').value = author;
            document.getElementById('edit-book-desc').value = desc;
            openModal('edit-book-modal');
        }

        async function handleUpdateBook(e) {
            e.preventDefault();

            const id = document.getElementById('edit-book-id').value;
            const payload = {
                title: document.getElementById('edit-book-title').value,
                author: document.getElementById('edit-book-author').value,
                description: document.getElementById('edit-book-desc').value
            };

            try {
                await apiFetch(`${BOOK_API}/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });

                showToast('도서 정보가 수정되었습니다.');
                closeModal('edit-book-modal');
                await loadBooks();
                renderMyBooks();
            } catch (e) {
                showToast(e.message || '수정 처리 오류', false);
            }
        }

        async function deleteBook(id) {
            if (!confirm('정말로 해당 도서를 영구 삭제하시겠습니까?')) return;

            try {
                await apiFetch(`${BOOK_API}/${id}`, {
                    method: 'DELETE'
                });

                showToast('도서가 삭제되었습니다.');
                await loadBooks();
                renderMyBooks();
            } catch (e) {
                showToast(e.message || '삭제 처리 오류', false);
            }
        }

        function renderBookCheckboxes(books) {
            document.getElementById('vote-book-checkboxes').innerHTML = books.map(b => `
                <label class="flex items-center gap-2 cursor-pointer p-1 hover:bg-gray-50 rounded">
                    <input type="checkbox" name="bookIds" value="${b.id}" class="accent-primary">
                    <span class="font-medium">${b.title}</span> <span class="text-xs text-textsec">(${b.author})</span>
                </label>
            `).join('');
        }

        async function loadPolls() {
            try {
                const result = await apiFetch(VOTE_API);
                renderPolls(result.data || []);
            } catch (e) {
                showToast("투표 목록 조회 실패", false);
            }
        }

        function renderPolls(polls) {
            const openPolls = (polls || []).filter(p => p.status === 'OPEN');

            if (openPolls.length === 0) {
                document.getElementById('vote-list').innerHTML = `
                    <div class="text-center py-12 text-textsec text-sm bg-surface border border-gray-200 rounded-xl">
                        진행 중인 투표가 없습니다.
                    </div>
                `;
                return;
            }

            document.getElementById('vote-list').innerHTML = openPolls.map(poll => `
                <div class="bg-surface border border-gray-200 rounded-xl p-5 shadow-sm flex justify-between items-center">
                    <div>
                        <span class="inline-block px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded mb-2">LIVE 투표중</span>
                        <h3 class="text-lg font-bold">${poll.title}</h3>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="viewPollDetail(${poll.id})" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-primaryHover">투표 참여</button>
                        <button onclick="viewVoteResult(${poll.id}, '${poll.title.replace(/'/g, "\\'")}')" class="bg-textmain text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800">결과 보기</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleCreateVote(e) {
            e.preventDefault();

            const bookIds = Array.from(document.querySelectorAll('input[name="bookIds"]:checked'))
                .map(cb => parseInt(cb.value, 10));

            if (bookIds.length < 2) {
                return showToast("후보 도서를 최소 2개 이상 선택해주세요.", false);
            }

            const payload = {
                title: document.getElementById('vote-title').value,
                bookIds
            };

            try {
                await apiFetch(VOTE_API, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                showToast('신규 투표가 생성되었습니다!');
                closeModal('vote-modal');
                e.target.reset();
                loadPolls();
            } catch (e) {
                showToast(e.message || '투표 생성 실패', false);
            }
        }

        async function viewPollDetail(pollId) {
            const bookIdToVote = prompt('투표할 도서 ID를 입력하십시오:');
            if (!bookIdToVote) return;

            try {
                await apiFetch(`${VOTE_API}/${pollId}/cast`, {
                    method: 'POST',
                    body: JSON.stringify({ bookId: parseInt(bookIdToVote, 10) })
                });

                showToast('투표 완료 🎉');
            } catch (e) {
                if (e.status === 409) {
                    showToast("이미 참여한 투표입니다.", false);
                    return;
                }
                showToast(e.message || '투표 통신 오류', false);
            }
        }

        async function viewVoteResult(pollId, pollTitle) {
            try {
                const result = await apiFetch(`${VOTE_API}/${pollId}/results`);

                document.getElementById('result-modal-title').innerText = `📊 결과: ${pollTitle}`;
                const chartContainer = document.getElementById('result-chart-container');
                chartContainer.innerHTML = '';

                const results = result.data || [];
                if (results.length === 0) {
                    chartContainer.innerHTML = `<p class="text-center text-textsec text-sm">집계된 투표 결과가 없습니다.</p>`;
                } else {
                    const totalVotes = results.reduce((sum, item) => sum + (item.votes || 0), 0) || 1;

                    results.forEach((item, index) => {
                        const targetBook = booksData.find(b => String(b.id) === String(item.bookId));
                        const bookTitle = targetBook ? targetBook.title : `도서 [ID: ${item.bookId}]`;
                        const percentage = Math.round(((item.votes || 0) / totalVotes) * 100);

                        chartContainer.innerHTML += `
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span>${index + 1}위 - ${bookTitle}</span>
                                    <span class="text-primary">${item.votes || 0}표 (${percentage}%)</span>
                                </div>
                                <div class="w-full bg-gray-100 h-4 rounded-full overflow-hidden">
                                    <div class="bg-primary h-full transition-all duration-1000" style="width: ${percentage}%"></div>
                                </div>
                            </div>
                        `;
                    });
                }

                openModal('result-modal');
            } catch (e) {
                showToast(e.message || '결과 데이터 로드 실패', false);
            }
        }

        function renderVoteHistory(history) {
            const container = document.getElementById('content-my-votes');

            if (!history || history.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-textsec text-sm">참여한 투표 히스토리가 없습니다.</div>`;
                return;
            }

            container.innerHTML = history.map(h => `
                <div class="bg-surface border border-gray-200 rounded-xl p-5 shadow-sm flex justify-between items-center hover:bg-gray-50/50">
                    <div>
                        <h4 class="font-bold text-textmain text-base mb-1">${h.pollTitle}</h4>
                        <p class="text-sm text-textsec">투표 선택지: <span class="text-primary font-bold">${h.votedBookTitle}</span></p>
                        <span class="text-[11px] text-gray-400 block mt-2">일시: ${h.votedAt}</span>
                    </div>
                    <button onclick="viewVoteResult(${h.pollId}, '${h.pollTitle.replace(/'/g, "\\'")}')" class="text-xs bg-textmain text-white px-3 py-2 rounded-md hover:bg-gray-800 font-medium">통계 결과 보기</button>
                </div>
            `).join('');
        }

        async function loadMyVotes() {
            const container = document.getElementById('content-my-votes');

            try {
                const result = await apiFetch(`${VOTE_API}/my-votes`);
                renderVoteHistory(result.data || []);
            } catch (e) {
                container.innerHTML = `
                    <div class="text-center py-12 text-red-500 text-sm">
                        투표 기록을 불러오지 못했습니다.
                    </div>
                `;
            }
        }

        function initNotificationPolling() {
            pollNotificationServer();

            if (notificationPoller) {
                clearInterval(notificationPoller);
            }

            notificationPoller = setInterval(pollNotificationServer, 3000);
        }

        async function pollNotificationServer() {
            try {
                const result = await apiFetch(NOTIFY_API);
                const freshNotifications = result.data || [];

                localNotifications = freshNotifications.slice(0, 30);
                renderNotificationDropdown();

                if (freshNotifications.length > 0) {
                    const latestNoti = freshNotifications[0];
                    const latestTimestamp = getNotificationTimestamp(latestNoti);

                    if (latestTimestamp && latestTimestamp !== checkedLastTimestamp) {
                        checkedLastTimestamp = latestTimestamp;

                        const type = getNotificationType(latestNoti);
                        let displayMsg = latestNoti.message || '새 알림이 도착했습니다.';
                        if (type === 'VOTE_CAST') displayMsg = `🗳️ [투표 알림] ${latestNoti.message}`;
                        if (type === 'BOOK_REGISTERED') displayMsg = `📚 [신간 등록] ${latestNoti.message}`;

                        showToast(displayMsg, true);
                    }
                }
            } catch (e) {
                console.log("알림 허브 폴링 서비스가 응답하지 않습니다.");
            }
        }

        function renderNotificationDropdown() {
            const listContainer = document.getElementById('noti-dropdown-list');
            const badge = document.getElementById('noti-badge');

            if (localNotifications.length === 0) {
                listContainer.innerHTML = `<div class="p-4 text-center">새로운 알림이 없습니다.</div>`;
                badge.classList.add('hidden');
                return;
            }

            badge.classList.remove('hidden');
            listContainer.innerHTML = localNotifications.map(n => {
                const type = getNotificationType(n);
                const createdAt = getNotificationTimestamp(n);
                const timeText = createdAt ? createdAt.substring(11, 16) : '방금 전';

                return `
                    <div class="p-3 hover:bg-gray-50 transition-colors flex flex-col gap-0.5">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-[10px] ${type === 'VOTE_CAST' ? 'text-blue-500' : 'text-primary'}">${type}</span>
                            <span class="text-[9px] text-gray-400">${timeText}</span>
                        </div>
                        <p class="text-textmain font-medium text-xs leading-relaxed">${n.message || ''}</p>
                    </div>
                `;
            }).join('');
        }

        function toggleNotificationDropdown() {
            const dropdown = document.getElementById('noti-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function clearNotifications() {
            localNotifications = [];
            renderNotificationDropdown();
            showToast("모든 로컬 알림 캐시를 비웠습니다.");
        }

        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('noti-dropdown');
            if (
                !dropdown.classList.contains('hidden') &&
                !e.target.closest('#noti-dropdown') &&
                !e.target.closest('button[onclick="toggleNotificationDropdown()"]')
            ) {
                dropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
